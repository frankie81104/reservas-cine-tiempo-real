events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    client_max_body_size 10m;
    
    # 1. Zona de rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Validación de formato del token en el gateway
    map $http_authorization $token_valido {
        default         0;
        "~^Bearer .+"   1;
    }

    server {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
        listen 8080;
        server_name _;

        # Health check del gateway
        location = /health {
            default_type application/json;
            return 200 '{"estado": "ok"}';
        }

        # 3. Rutas REST
        location /api/funciones {
            if ($token_valido = 0) {
                return 401 '{"codigo": "NO_AUTENTICADO", "mensaje": "Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://servicio-funciones:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/asientos {
            if ($token_valido = 0) {
                return 401 '{"codigo": "NO_AUTENTICADO", "mensaje": "Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://servicio-asientos:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/metricas {
            if ($token_valido = 0) {
                return 401 '{"codigo": "NO_AUTENTICADO", "mensaje": "Token ausente o inválido."}';
            }
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://servicio-asientos:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. WebSockets (El token va en la URL, el backend lo valida)
        location /ws/ {
            proxy_pass http://mock-websocket:8081; # O el servicio real cuando lo tengas
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 5. Manejo de errores personalizados (OpenAPI)
        error_page 502 503 504 @servicio_caido;
        location @servicio_caido {
            default_type application/json;
            return 503 '{"codigo": "SERVICIO_NO_DISPONIBLE", "mensaje": "El servicio no está disponible en este momento."}';
        }

        error_page 429 @demasiadas_solicitudes;
        location @demasiadas_solicitudes {
            default_type application/json;
            add_header Retry-After 5;
            return 429 '{"codigo": "LIMITE_EXCEDIDO", "mensaje": "Demasiadas solicitudes. Intentá de nuevo en unos segundos."}';
        }
    }
}